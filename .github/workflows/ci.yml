name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 为什么这里只跑「不需要 MLX」的测试，不跑数值等价性测试：
#
# 1. MLX 在无头 / 无 GPU 的环境中**导入即崩溃**（NSRangeException），参见
#    https://github.com/ml-explore/mlx/issues/3148 。GitHub 托管的 macOS runner
#    正是这种虚拟机，没有 Metal GPU 直通。
# 2. 等价性测试还需要 2.4 GB 的 checkpoint 权重，不适合放进 CI。
#
# 因此 CI 覆盖的是「不需要 MLX、不需要 GPU、不需要权重」的那一层，共 43 项：
#   tests/test_contract.py  协议层：校验、概率归一、异常输入
#   tests/test_demo.py      贪吃蛇环境、规划器、对局循环（用桩引擎）
#   tests/test_live.py      实时 HTTP 服务，起真实服务走本地回环请求（同样用桩引擎）
# 这得益于 nanojev_mlx.answers 与 predict.py 的分离，以及 demo 不导入 MLX。
# 等价性测试请在本机运行：
#
#     NANOJEV_CHECKPOINT=/path/to/checkpoints/NanoJev python -m unittest discover -s tests -v

jobs:
  test:
    name: 无需 MLX 的测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: python -m compileall -q nanojev_mlx benchmarks tests

      - name: 校验包元数据可安装（不拉取 mlx 依赖）
        run: pip install --no-deps -e .

      - name: 测试
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          # Python 3.10 在零测试时仍返回 0（退出码 5 是 3.12 才加的），显式兜底
          if grep -qE "^Ran 0 tests" test-output.txt; then
            echo "::error::没有收集到任何测试"; exit 1
          fi
